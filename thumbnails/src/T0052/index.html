<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720">
<script src="./gsap.min.js"></script><script src="./three.min.js"></script><script src="./geo.js"></script><script src="./sonar.js"></script>
<style>
@font-face{font-family:SceneSans;src:local('Segoe UI Variable Display'),local('Segoe UI Variable'),local('Segoe UI');font-weight:100 900}
*{box-sizing:border-box}html,body{width:1280px;height:720px;margin:0;overflow:hidden;background:#000;color:#f3f5f8;font-family:SceneSans,'Segoe UI',sans-serif}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#000}
#map{position:absolute;left:425px;top:80px;width:1152px;height:648px;overflow:hidden}
#map-stage{position:absolute;width:1920px;height:1080px;transform:scale(.6);transform-origin:0 0}
.sos #map{top:180px}
canvas,#map-art{position:absolute;inset:0;width:1920px;height:1080px}
#map-shade{position:absolute;inset:0;background:linear-gradient(180deg,#000 0%,#000c 28%,transparent 48%);pointer-events:none}
#person{position:absolute;left:28px;top:155px;height:615px;width:auto;mask-image:linear-gradient(180deg,#000 0%,#000 78%,transparent 100%)}
.sos #person{left:34px;top:185px;height:580px}
.title{position:absolute;left:454px;top:40px;font-size:154px;line-height:1.12;font-weight:650;letter-spacing:-.04em}
.line{position:absolute;left:461px;top:218px;font-size:60px;line-height:1.1;font-weight:550;letter-spacing:-.026em;white-space:nowrap}
#signal{position:absolute;left:54px;top:48px;width:94px;height:82px;opacity:.7}
.phone{fill:#07111b;stroke:#87b6e4;stroke-width:3}.phone-screen{fill:#10243a;stroke:#4da3ff;stroke-width:1.5}
.route{fill:none;stroke:#4da3ff;stroke-width:3;stroke-dasharray:5 14;opacity:.65}
.pulse{fill:none;stroke:#ff4d5e;stroke-width:3;filter:drop-shadow(0 0 12px #ff4d5e);opacity:.65}
</style></head>
<body data-mode="1"><div id="root" data-composition-id="thumb52" data-start="0" data-duration="1" data-width="1280" data-height="720" data-fps="30">
<div id="map"><div id="map-stage"><canvas id="campus" width="1920" height="1080"></canvas><svg id="map-art" viewBox="0 0 1920 1080" aria-hidden="true"></svg></div></div>
<div id="map-shade"></div><img id="person" src="./relay-person.png" alt="">
<svg id="signal" viewBox="0 0 94 82" fill="none" stroke="#f3f5f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 65V55h12v10M30 65V43h12v22M51 65V30h12v35M72 65V17h12v48M7 13l78 61"/></svg>
<div class="title">iTantra</div><div class="line">Speak. Send. Be heard.</div>
</div><script>
const mode=Number(document.body.dataset.mode), sos=mode===3;
if(sos){document.body.classList.add('sos');document.getElementById('person').src='./sos-person.png'}
document.querySelector('.line').textContent=mode===1?'Speak. Send. Be heard.':'No network. Still heard.';
const renderer=Sonar(document.getElementById('campus'),GEO);
// The film's actual campus and camera; left offset makes room for the person.
const cam=sos?{tx:350,tz:660,D:640,pitch:57,yaw:-2}:{tx:458,tz:690,D:900,pitch:55,yaw:0};
renderer.render(sos?3.6:6.4,{cam,pulses:sos?[{x:330,y:598,t0:-30,speed:300}]:[{x:470,y:640,t0:.35,speed:230},{x:470,y:640,t0:2.25,speed:260},{x:330,y:598,t0:4.3,speed:300}],floor:sos?.85:.6,ringFade:sos?0:1});
const q=p=>renderer.project(p[0],p[1],0);
const phone=(p,red=false)=>{const a=q(p);return `<g transform="translate(${a.x} ${a.y}) scale(1.25)"><ellipse cy="20" rx="35" ry="17" fill="none" stroke="${red?'#ff4d5e':'#4da3ff'}" stroke-width="2" opacity=".35"/><rect class="phone" x="-15" y="-36" width="30" height="53" rx="6"/><rect class="phone-screen" x="-10" y="-28" width="20" height="35" rx="2"/><path d="M-4 -32h8" stroke="#cbe2f7" stroke-width="1.5"/><circle cy="12" r="1.8" fill="${red?'#ff4d5e':'#4da3ff'}"/></g>`};
const art=document.getElementById('map-art');
if(!sos){
 const points=[[330,598],[271,715],[325,780],[440,796],[560,830]], screens=points.map(q);
 const route=screens.map((p,i)=>`${i?'L':'M'}${p.x} ${p.y}`).join('');
 // Midpoint of R2 -> R3, with the same small vertical lift as the film.
 const p=renderer.project((325+440)/2,(780+796)/2,9);
 art.innerHTML=`<path class="route" d="${route}"/>`+points.map(p=>phone(p)).join('')+
 `<g transform="translate(${p.x} ${p.y-16}) scale(1.45)"><rect x="-43" y="-24" width="86" height="48" rx="16" fill="#4da3ff" style="filter:drop-shadow(0 0 11px #4da3ff66)"/><path d="M-10 -2v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#f3f5f8" stroke-width="4"/><rect x="-16" y="-3" width="32" height="23" rx="5" fill="#f3f5f8"/></g>`;
}else{
 const origin=q([330,598]);
 // One local pulse origin; no relay route, packet, recipient UI, or hop lines.
 art.innerHTML=`<circle class="pulse" cx="${origin.x}" cy="${origin.y}" r="245"/><circle class="pulse" cx="${origin.x}" cy="${origin.y}" r="142" style="opacity:.32"/>`+phone([330,598],true);
}
const tl=gsap.timeline({paused:true});tl.to({},{duration:1});window.__timelines={thumb52:tl};
</script></body></html>
