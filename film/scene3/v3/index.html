<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<script src="./gsap.min.js"></script><script src="./assets/glass/glass.js"></script>
<link rel="stylesheet" href="./assets/glass/glass.css">
<style>
@font-face{font-family:SceneSans;src:local('Segoe UI Variable Display'),local('Segoe UI Variable'),local('Segoe UI');font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0d12;color:#f3f5f8;font-family:SceneSans,'Segoe UI',sans-serif}
#root{position:relative;width:1920px;height:1080px;overflow:hidden}
.scene{position:absolute;inset:0;display:none;overflow:hidden;background:#0a0d12}
.full{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover}
.card-footage{filter:blur(40px) brightness(.58) saturate(.85);transform:scale(1.07)}
.card-red{position:absolute;inset:0;background:rgba(105,17,30,.16)}
#sos-card{display:grid;place-items:center;text-align:center;transform-origin:50% 50%;z-index:2}
#sos-card h1{font-size:64px;font-weight:650;line-height:1.08;margin:0}
.split .camera{position:absolute;left:0;top:0;width:1232px;height:1080px;overflow:hidden;background:#0a0d12}
.camera-motion{position:absolute;left:-250px;top:0;width:1920px;height:1080px;max-width:none;object-fit:cover}
.camera-vivek .camera-motion{left:-200px}
.feather{position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,transparent,#0a0d12);pointer-events:none}
.app-field{position:absolute;left:1232px;top:0;width:688px;height:1080px;background:#0a0d12;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen{position:relative;height:1000px;max-width:560px;border-radius:32px;border:1px solid rgba(255,255,255,.14);overflow:hidden;background:#101820;box-shadow:0 22px 65px #000a;flex:none}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#101820}
#techline-layer,#caption-layer{position:absolute;inset:0;pointer-events:none;z-index:20}
#techline{display:none}
#caption{display:none}
</style></head>
<body><div id="root" data-composition-id="scene3-v3" data-start="0" data-duration="51.400000" data-width="1920" data-height="1080">
<div class="scene" id="seg_card_out"><video id="video_card_out" class="full card-footage" src="assets/vachana.mp4" data-start="0" data-duration="1.600000" data-media-start="0" muted playsinline></video><div class="card-red"></div><div class="glass-card full" id="sos-card"><h1>SOS: help from anyone nearby</h1></div></div>
<div class="scene" id="seg_s3_open"><video id="video_s3_open" class="full" src="assets/vachana.mp4" data-start="1.600000" data-duration="2.866667" data-media-start="0" muted playsinline></video></div>
<div class="scene split" id="seg_vachana_sos"><div class="camera camera-vachana"><video id="video_vachana_sos_camera" class="camera-motion" src="assets/vachana.mp4" data-start="4.466667" data-duration="7.773333" data-media-start="2.866667" muted playsinline></video><div class="feather"></div></div><div class="app-field" id="vachana-field"><div class="screen" style="width:471.62px;background:#101820 url(assets/vachana_sos_first.jpg) center/100% 100% no-repeat"><video id="video_vachana_sos" src="assets/vachana_sos.mp4" data-start="4.466667" data-duration="12.966667" data-media-start="0" muted playsinline></video></div></div></div>
<div class="scene" id="seg_sos_in"><video id="video_sos_in" class="full" src="assets/sos_in.mp4" data-start="17.433333" data-duration="2.000000" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_sos_sonar"><video id="video_sos_sonar" class="full" src="assets/sos_sonar.mp4" data-start="19.433333" data-duration="9.000000" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_sos_dive"><video id="video_sos_dive" class="full" src="assets/sos_dive.mp4" data-start="28.433333" data-duration="1.500000" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_lab_open"><video id="video_lab_open" class="full" src="assets/vivek.mp4" data-start="29.933333" data-duration="1.300000" data-media-start="0" muted playsinline></video></div>
<div class="scene split" id="seg_vivek_app"><div class="camera camera-vivek"><video id="video_vivek_app_camera1" class="camera-motion" src="assets/vivek.mp4" data-start="38.733333" data-duration="1.300000" data-media-start="1.300000" muted playsinline></video><video id="video_vivek_app_camera2" class="camera-motion" src="assets/vivek.mp4" data-start="42.100000" data-duration="5.066667" data-media-start="2.600000" muted playsinline></video><div class="feather"></div></div><div class="app-field" id="vivek-field"><div class="screen" style="width:471.62px;background:#101820 url(assets/vivek_app_first.jpg) center/100% 100% no-repeat"><video id="video_vivek_app" src="assets/vivek_app.mp4" data-start="31.233333" data-duration="20.166667" data-media-start="0" muted playsinline></video></div></div></div>
<div id="techline-layer"><div class="techline" id="techline"></div></div>
<div id="caption-layer"><div class="caption" id="caption"></div></div>
</div>
<script>
const T={"fps":30,"duration":51.4,"segments":[{"name":"card_out","start":0.0,"end":1.6,"source":"FOOTAGE:Video/sospart1.mp4"},{"name":"s3_open","start":1.6,"end":4.466666666666667,"source":"FOOTAGE:Video/sospart1.mp4","source_in":0},{"name":"vachana_sos","start":4.466666666666667,"end":17.433333333333334,"camera":"FOOTAGE:Video/sospart1.mp4","camera_in":2.866667},{"name":"sos_in","start":17.433333333333334,"end":19.433333333333334},{"name":"sos_sonar","start":19.433333333333334,"end":28.433333333333334},{"name":"sos_dive","start":28.433333333333334,"end":29.933333333333334},{"name":"lab_open","start":29.933333333333334,"end":31.233333333333334,"source":"FOOTAGE:Video/sospart2.mp4","source_in":3.0},{"name":"vivek_app","start":31.233333333333334,"end":51.400000000000006,"camera":"FOOTAGE:Video/sospart2.mp4","camera_in":4.3}],"vivek_camera":{"m1_from":7.5,"m1_to":8.8,"m2_from":10.866666666666667,"m2_to":15.933333333333334},"techlines":[{"start":19.433333333333334,"end":22.033333333333335,"text":"No saved contact needed"},{"start":22.033333333333335,"end":25.333333333333336,"text":"Reaches the 3 strongest phones nearby first, then widens the search"},{"start":27.433333333333334,"end":29.933333333333334,"text":"The helper must accept"}],"narration_starts":{"N5":1.9000000000000001,"N6":20.433333333333334},"slot_fields":{"vachana_sos":{"duration":12.966667,"listen_at":1.4,"send_at":11.23},"vivek_app":{"duration":21.366667,"accept_at":2.6,"play_at":7.63,"ptt_down":12.76,"ptt_up":16.22,"sent_at":19.77}}},CAPTIONS=[{"start":1.9,"end":5.5,"text":"What if you need help,\nbut don't know who's nearby?"},{"start":5.867,"end":8.467,"text":"I'm lost somewhere near\nthe construction site."},{"start":8.787,"end":9.527,"text":"Please reach me out."},{"start":9.967,"end":10.587,"text":"Help me anyone."},{"start":20.433,"end":23.633,"text":"iTantra searches nearby for help."},{"start":23.633,"end":26.933,"text":"If someone accepts, they can hear\nthe SOS and reply."},{"start":39.013,"end":40.96,"text":"I'm lost somewhere near\nthe construction site."},{"start":40.96,"end":42.868,"text":"Please reach me out.\nHelp me anyone."},{"start":44.093,"end":44.573,"text":"Wait,"},{"start":44.573,"end":45.653,"text":"I'm in the chemistry lab."},{"start":45.653,"end":46.893,"text":"I'll come get you, wait."}],rows=T.segments;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=gsap.parseEase('power2.inOut');
function takeover(field,camera,amount){
  const f=ease(clamp(amount));
  field.style.left=(1232*(1-f))+'px';field.style.width=(688+1232*f)+'px';
  field.querySelector('.screen').style.transform=`scale(${1+.08*f})`;
  if(camera){camera.style.transform=`translateX(${-1232*f}px)`;camera.style.opacity=1-f;}
}
function render(t){
  document.querySelectorAll('.scene').forEach(el=>el.style.display='none');
  for(const [id,name] of [['vachana-field','vachana_sos'],['vivek-field','vivek_app']]){
    const field=document.getElementById(id),parent=document.getElementById('seg_'+name);
    if(field.parentElement!==parent)parent.appendChild(field);
    field.style.left='1232px';field.style.width='688px';field.style.opacity='1';
    field.querySelector('.screen').style.transform='';
  }
  const tech=T.techlines.find(x=>t>=x.start&&t<x.end),te=document.getElementById('techline');
  te.style.display=tech?'block':'none';if(tech)te.textContent=tech.text;
  const cap=CAPTIONS.find(x=>t>=x.start&&t<x.end),ce=document.getElementById('caption');
  ce.style.display=cap?'block':'none';if(cap)ce.textContent=cap.text;
  const r=rows.find(x=>t>=x.start&&t<x.end);if(!r)return;
  const e=document.getElementById('seg_'+r.name);if(!e)return;e.style.display='block';
  const st=t-r.start;
  const tts=r.name==='vivek_app'&&st>=T.slot_fields.vivek_app.play_at+.15&&st<T.slot_fields.vivek_app.play_at+4.01;
  ce.style.left=tts?'350px':'50%';ce.style.maxWidth=tts?'640px':'1400px';
  if(r.name==='card_out'){
    const f=ease(clamp(st/1.6)),card=document.getElementById('sos-card');
    card.style.transform=`scale(${1-.78*f})`;
    card.style.opacity=1-clamp((st-.9)/.7);
  }
  if(r.name==='s3_open'&&st>=2.4){
    const f=ease(clamp((st-2.4)/.466667));
    const v=e.querySelector('video');v.style.width=(1920-688*f)+'px';v.style.objectPosition='36.337% center';
    e.style.background='#0a0d12';
    const field=document.getElementById('vachana-field');e.appendChild(field);
    field.style.left=(1232+688*(1-f))+'px';field.style.opacity=f;
  }
  if(r.name==='vachana_sos'){
    const camera=e.querySelector('.camera'),field=document.getElementById('vachana-field');
    const stillMoving=st<10.64-2.866667;
    camera.style.display=stillMoving?'block':'none';
    takeover(field,camera,(st-(10.64-2.866667-.5))/.5);
  }
  if(r.name==='lab_open'&&st>=r.end-r.start-.5){
    const field=document.getElementById('vivek-field');e.appendChild(field);
    const f=ease(clamp((st-(r.end-r.start-.5))/.5));
    takeover(field,null,1);field.style.opacity=f;
  }
  if(r.name==='vivek_app'){
    const C=T.vivek_camera,camera=e.querySelector('.camera'),field=document.getElementById('vivek-field');
    const v=e.querySelectorAll('.camera-motion');
    const in1=st>=C.m1_from&&st<C.m1_to,in2=st>=C.m2_from&&st<C.m2_to;
    v[0].style.display=in1?'block':'none';v[1].style.display=in2?'block':'none';
    camera.style.display=(in1||in2)?'block':'none';
    const visibility=in1?clamp((st-C.m1_from)/.25)*clamp((C.m1_to-st)/.25):
      in2?clamp((st-C.m2_from)/.25)*clamp((C.m2_to-st)/.25):0;
    takeover(field,camera,1-visibility);
  }
}
const tl=gsap.timeline({paused:true,onUpdate:()=>render(tl.time())});tl.to({}, {duration:T.duration},0);
window.addEventListener('hf-seek',event=>render(event.detail.time));
window.__timelines=window.__timelines||{};window.__timelines['scene3-v3']=tl;render(0);
</script></body></html>
