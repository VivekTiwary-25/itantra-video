<style>
  :root { --sos: #E65A63; --sos-glow: #D62F40; --sos-wake: #A52936; }

<body>
<div id="root" data-composition-id="sos_sonar" data-start="0" data-duration="9.0" data-width="1920" data-height="1080">
  <div id="sonarL">
    <canvas id="sonar" width="1920" height="1080" data-layout-allow-overflow></canvas>
    <svg id="waves" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    <div id="pV" class="pt"><i class="halo"></i><i class="ping"></i><i class="core"></i></div>
    <div id="pK" class="pt"><i class="halo"></i><i class="ping"></i><i class="core"></i></div>
    <div id="lV" class="lab">Vachana</div>
    <div id="lK" class="lab">Vivek</div>
  </div>

  <div id="flare"></div>
  <audio id="sfx" class="clip" src="assets/sos_sonar_sfx.wav" data-start="0" data-duration="9.0" data-volume="1"></audio>
</div>

<script>
  // All times and positions come from film/scene3/sonar/cues.py (filled in by build.py).
  const CFG = {"V": [330, 598], "VIVEK": [350, 722], "speed": 62.0, "waves": [[-0.9, 82.0], [0.9, 90.0], [2.7, 102.0], [4.45, 114.0], [5.975, 175.0]], "arrive": 8.0, "arrive_r": 125.60254774486066, "cam_close": {"tx": 330, "tz": 598, "D": 95, "pitch": 80, "yaw": 0}, "sonar_start": {"tx": 350, "tz": 660, "D": 640, "pitch": 57, "yaw": -2}, "sonar_end": {"tx": 346, "tz": 668, "D": 590, "pitch": 58, "yaw": 0}, "dive_to": {"tx": 350, "tz": 722, "D": 38, "pitch": 82, "yaw": 0}, "mode": "sos_sonar", "t_offset": 0.0};
  const U = window.SonarUtil, E = U.ease;
  const root = document.getElementById('root');
  const sos = window.SOS(root, CFG);
  const sonarL = document.getElementById('sonarL'), flare = document.getElementById('flare');
  const mode = CFG.mode;

  function camAt(T) {
    if (T < 0) {                                   // sos_in pull-back (ends exactly on SONAR_START at T = 0)
      const f = U.span(T, CFG.pull_back_T[0], 0);
      return U.lerpCam(CFG.cam_close, CFG.sonar_start, E.out(f), E.out(f));
    }
    if (T <= 9) return U.lerpCam(CFG.sonar_start, CFG.sonar_end, E.sine(T / 9));
    const f = U.span(T - 9, CFG.dive[0], CFG.dive[1]);  // sos_dive
    return U.lerpCam(CFG.sonar_end, CFG.dive_to, E.inOut(f), E.in(f));
  }

  // ---------- sos_in: phone layer
  let phoneL, appRings, sg, SX, SY, PX0, PW;
  if (mode === 'sos_in') {
    phoneL = document.getElementById('phoneL');
    const phone = document.getElementById('phone');
    PW = CFG.phone_w; PX0 = (1920 - PW) / 2;
    Object.assign(phone.style, { left: PX0 + 'px', width: PW + 'px' });
    SX = PX0 + CFG.search_xy[0] * PW; SY = CFG.search_xy[1] * 1080;
    appRings = [...document.querySelectorAll('#appWaves g')];
    appRings.forEach(g => g.querySelectorAll('circle').forEach(c => { c.setAttribute('cx', SX); c.setAttribute('cy', SY); }));
    sg = document.getElementById('searchGlow');
    Object.assign(sg.style, { left: SX + 'px', top: SY + 'px' });
  }

  function draw(t) {
    const T = t + CFG.t_offset;
    if (mode === 'sos_in') {
      // red rings grow out of the searching indicator, then the phone shrinks into V and the sonar takes over
      CFG.app_pulses.forEach((p0, i) => {
        const f = U.span(t, p0, p0 + 0.95), g = appRings[i];
        const r = 14 + 330 * E.out(f);
        g.querySelectorAll('circle').forEach(c => c.setAttribute('r', r.toFixed(1)));
        g.style.opacity = (f > 0 && f < 1 ? (1 - f) * E.sine(f / 0.12) : 0).toFixed(3);
      });
      sg.style.opacity = (0.9 * E.sine(U.span(t, 0.05, 0.35)) * (1 - E.sine(U.span(t, 0.9, 1.2)))).toFixed(3);
      const fo = U.span(t, CFG.phone_out[0], CFG.phone_out[1]);
      const s = 1 - 0.78 * E.in(fo);
      const dx = (960 - SX) * E.inOut(fo), dy = (540 - SY) * E.inOut(fo);
      phoneL.style.transformOrigin = `${SX}px ${SY}px`;
      phoneL.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${s.toFixed(4)})`;
      phoneL.style.opacity = (1 - E.sine(U.span(t, CFG.phone_out[0] + 0.15, CFG.phone_out[1]))).toFixed(3);
      const sv = E.sine(U.span(t, CFG.sonar_in[0], CFG.sonar_in[1]));
      sonarL.style.opacity = sv.toFixed(3);
      const fl = t < 0.95 ? E.in(U.span(t, 0.7, 0.95)) : 1 - E.sine(U.span(t, 0.95, 1.35));
      flare.style.opacity = (0.8 * fl).toFixed(3);
      flare.style.transform = `translate(960px, 540px) scale(${(0.2 + 1.2 * E.out(U.span(t, 0.7, 1.3))).toFixed(3)})`;
      if (t >= CFG.sonar_in[0] - 0.05) sos.draw(T, camAt(T), 1);
      return;
    }
    if (mode === 'sos_sonar') { sos.draw(T, camAt(T), 1); return; }
    // sos_dive: dive into Vivek's point; the red flare lands on his phone in the lab
    const td = t;
    const layerA = 1 - E.sine(U.span(td, 0.7, 0.98));
    sonarL.style.opacity = layerA.toFixed(3);
    let k = { x: 960, y: 540 };
    if (td <= 1.0) k = sos.draw(T, camAt(T), 1).K;
    const m = E.inOut(U.span(td, 0.6, 1.0));
    const fx = U.lerp(k.x, CFG.phone[0], m), fy = U.lerp(k.y, CFG.phone[1], m);
    const fa = td < 0.8 ? E.in(U.span(td, 0.45, 0.8)) : 1 - E.sine(U.span(td, 0.8, 1.2));
    flare.style.opacity = (0.9 * fa).toFixed(3);
    flare.style.transform = `translate(${fx.toFixed(1)}px, ${fy.toFixed(1)}px) scale(${(0.15 + 1.8 * E.in(U.span(td, 0.45, 1.05))).toFixed(3)})`;
  }

  const tl = gsap.timeline({ paused: true, onUpdate: () => draw(tl.time()) });
  tl.to({}, { duration: 9.0 }, 0);
  if (mode === 'sos_dive') {
    const pg = document.getElementById('phoneGlow');
    Object.assign(pg.style, { left: CFG.phone[0] + 'px', top: CFG.phone[1] + 'px' });
    tl.fromTo('#clipL', { opacity: 0 }, { opacity: 1, duration: CFG.clip_in[1] - CFG.clip_in[0], ease: 'sine.inOut' }, CFG.clip_in[0]);
    tl.fromTo('#clipZoom', { scale: 1.12, filter: 'blur(9px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, CFG.clip_in[0]);
    tl.fromTo(pg, { opacity: 0 }, { opacity: 1, duration: CFG.glow[1] - CFG.glow[0], ease: 'sine.inOut' }, CFG.glow[0]);
    document.getElementById('clipZoom').style.transformOrigin = `${CFG.phone[0]}px ${CFG.phone[1]}px`;
  }
  window.addEventListener('hf-seek', e => draw(e.detail.time));
  window.__timelines = window.__timelines || {};
  window.__timelines['sos_sonar'] = tl;
  draw(0);
</script>
