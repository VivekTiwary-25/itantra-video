<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<script src="./gsap.min.js"></script>
<style>
@font-face{font-family:Segoe;src:local('Segoe UI Variable')}*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#05070a;color:#f3f5f8;font-family:Segoe,'Segoe UI',sans-serif;overflow:hidden}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#05070a}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.full{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover}
#benchVideo{transform-origin:0 0}
#door{position:absolute;overflow:hidden;border:1px solid rgba(255,255,255,.24);background:rgba(5,7,10,.97);box-shadow:0 28px 80px rgba(0,0,0,.45)}
#door .picture{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.42);opacity:.94}
#door .matte{position:absolute;inset:0;background:rgba(10,13,18,.72)}
#door .title{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:600;letter-spacing:-.015em;text-shadow:0 2px 16px #000;opacity:0}
.sides{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.55);transform:scale(1.04)}
.sides video{width:100%;height:100%;object-fit:cover}
.sides.self{background:#080d13;filter:blur(40px) brightness(.55)}
.screen{position:absolute;left:717px;top:0;width:486px;height:1080px;border-radius:28px;overflow:hidden;background:#0a0e14;box-shadow:0 12px 58px #000c,0 0 0 1px #ffffff22}
.screen video{width:100%;height:100%;object-fit:contain;background:#05070a}
.placeholder{width:100%;height:100%;display:grid;place-items:center;color:#8a939e;background:#0b1018;font-size:28px;letter-spacing:.04em;text-align:center}
.freeze{position:absolute;inset:0;background-size:cover;background-position:center}
#fade{position:absolute;inset:0;background:#05070a;pointer-events:none;display:none}
</style></head><body>
<div id="root" data-composition-id="scene2" data-start="0" data-duration="98.133" data-width="1920" data-height="1080">
  <div class="scene" id="bench"><video id="benchVideo" class="clip full" src="assets/bench.mp4" data-start="3" data-duration="5.2" data-media-start="0" muted playsinline></video></div>
  <div id="door"><div class="picture"></div><div class="matte"></div><div class="title">How the app works</div></div>
  <div id="sections"><div class="scene" id="seg_vachana_send"><div class="sides" style="background-image:url(assets/bench_end.jpg)"><video id="media_1" class="clip " src="assets/bench_tail.mp4" data-start="7.7" data-duration="6.1" data-media-start="0" muted playsinline></video></div><div class="screen"><div class="placeholder">APP: vachana_send</div></div></div>
<div class="scene" id="seg_vachana_send_freeze"><div class="sides" style="background-image:url(assets/bench_end.jpg)"></div><div class="screen"><div class="placeholder">APP: vachana_send</div></div></div>
<div class="scene" id="seg_walk"><video id="media_2" class="clip full" src="assets/walk.mp4" data-start="24.3" data-duration="6.0" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_maps"><div class="sides"></div><div class="screen"><div class="placeholder">APP: maps</div></div></div>
<div class="scene" id="seg_yash_before_notification"><video id="media_3" class="clip full" src="assets/yash_a.mp4" data-start="33.8" data-duration="2.667" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_yash_receive"><div class="sides" style="background-image:url(assets/yash_cut.jpg)"></div><div class="screen"><div class="placeholder">APP: yash_receive</div></div></div>
<div class="scene" id="seg_yash_after_notification"><video id="media_4" class="clip full" src="assets/yash_c.mp4" data-start="45.467" data-duration="7.066" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_yash_reply"><div class="sides" style="background-image:url(assets/yash_cut.jpg)"></div><div class="screen"><div class="placeholder">APP: yash_reply</div></div></div>
<div class="scene" id="seg_sonar_a"><video id="media_5" class="clip full" src="assets/sonar_a.mp4" data-start="57.033" data-duration="7.0" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_relay_1"><video id="media_6" class="clip full" src="assets/relay_1.mp4" data-start="64.033" data-duration="6.0" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_relay_2"><video id="media_7" class="clip full" src="assets/relay_2.mp4" data-start="70.033" data-duration="6.0" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_relay_3"><video id="media_8" class="clip full" src="assets/relay_3.mp4" data-start="76.033" data-duration="6.0" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_sonar_b"><video id="media_9" class="clip full" src="assets/sonar_b.mp4" data-start="82.033" data-duration="6.0" data-media-start="0" muted playsinline></video></div>
<div class="scene" id="seg_sonar_b_fade" style="background:center/cover url(assets/sonar_end.jpg)"></div>
<div class="scene" id="seg_vachana_reply"><div class="sides"></div><div class="screen"><div class="placeholder">APP: vachana_reply</div></div></div>
<div class="scene" id="seg_end_hold"><div class="sides"></div><div class="screen"><div class="placeholder">APP: vachana_reply</div></div></div></div><div id="fade"></div>
</div>
<script>
const T={"fps":30,"duration":98.133,"segments":[{"name":"doorway","start":0.0,"end":3.0},{"name":"bench","start":3.0,"end":7.7,"source":"FOOTAGE:Video/normalpart1.mp4","source_in":0},{"name":"vachana_send","start":7.7,"end":20.7,"dissolve_in":0.5},{"name":"vachana_send_freeze","start":20.7,"end":24.3},{"name":"walk","start":24.3,"end":30.3,"source":"FOOTAGE:Video/normalpart2.mp4"},{"name":"maps","start":30.3,"end":33.8},{"name":"yash_before_notification","start":33.8,"end":36.467,"source":"FOOTAGE:Video/normalpart6.mp4","source_in":0},{"name":"yash_receive","start":36.467,"end":45.467},{"name":"yash_after_notification","start":45.467,"end":52.533,"source":"FOOTAGE:Video/normalpart6.mp4","source_in":3.6},{"name":"yash_reply","start":52.533,"end":57.033},{"name":"sonar_a","start":57.033,"end":64.033},{"name":"relay_1","start":64.033,"end":70.033},{"name":"relay_2","start":70.033,"end":76.033},{"name":"relay_3","start":76.033,"end":82.033},{"name":"sonar_b","start":82.033,"end":88.033},{"name":"sonar_b_fade","start":88.033,"end":90.633},{"name":"vachana_reply","start":90.633,"end":97.633},{"name":"end_hold","start":97.633,"end":98.133}],"narration_starts":{"N1":20.9,"N2":57.033,"N3":86.033,"N4":88.333}}, A={"bench":"assets/bench.mp4","bench_tail":"assets/bench_tail.mp4","bench_start":"assets/bench_start.jpg","bench_end":"assets/bench_end.jpg","yash_a":"assets/yash_a.mp4","yash_c":"assets/yash_c.mp4","yash_cut":"assets/yash_cut.jpg","walk":"assets/walk.mp4","sonar_end":"assets/sonar_end.jpg","sonar_a":"assets/sonar_a.mp4","relay_1":"assets/relay_1.mp4","relay_2":"assets/relay_2.mp4","relay_3":"assets/relay_3.mp4","sonar_b":"assets/sonar_b.mp4"}, S={"vachana_send":{"video":null,"still":null},"maps":{"video":null,"still":null},"yash_receive":{"video":null,"still":null},"yash_reply":{"video":null,"still":null},"vachana_reply":{"video":null,"still":null}};
const rows=T.segments, by=Object.fromEntries(rows.map(x=>[x.name,x]));
const bench=document.getElementById('bench'), bv=document.getElementById('benchVideo'), door=document.getElementById('door');
door.querySelector('.picture').style.backgroundImage=`url('${A.bench_start}')`;
const fade=document.getElementById('fade');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=gsap.parseEase('power3.inOut');
function render(t){
  document.querySelectorAll('.scene').forEach(e=>e.style.display='none');
  if(t<3.4){
    const grow=ease(clamp((t-.2)/1.2)), shrink=ease(clamp((t-2.6)/.8));
    const f=t<2.6?grow:1-shrink;
    door.style.display='block';door.style.left=(734*(1-f))+'px';door.style.top=(70*(1-f))+'px';
    door.style.width=(452+1468*f)+'px';door.style.height=(940+140*f)+'px';door.style.borderRadius=(64*(1-f))+'px';
    door.style.opacity=t<2.6?1:1-shrink;
    door.querySelector('.picture').style.opacity=.94*clamp((t-.2)/.6);
    door.querySelector('.title').style.opacity=clamp((t-1)/.35)*clamp((2.6-t)/.3);
  }else door.style.display='none';
  if(t>=2.6&&t<by.vachana_send.start+.5){
    bench.style.display='block';
    const f=ease(clamp((t-5.4)/2.3)), scale=1+7.5*f;
    const cx=820+80*f,cy=930-350*f;
    bv.style.transform=`translate(${f*(960-scale*cx)}px,${f*(540-scale*cy)}px) scale(${scale})`;
  }
  let active=rows.find(r=>t>=r.start&&t<r.end&&r.name!=='doorway'&&r.name!=='bench');
  if(active){const e=document.getElementById('seg_'+active.name);if(e)e.style.display='block'}
  if(t>=by.vachana_send.start&&t<by.vachana_send.start+.5){
    const e=document.getElementById('seg_vachana_send');e.style.display='block';e.style.opacity=clamp((t-by.vachana_send.start)/.5);
  }else document.getElementById('seg_vachana_send').style.opacity=1;
  fade.style.display=active&&active.name==='sonar_b_fade'?'block':'none';
  if(fade.style.display==='block')fade.style.opacity=.91*clamp((t-by.sonar_b_fade.start)/2.6);
}
const tl=gsap.timeline({paused:true,onUpdate:()=>render(tl.time())});tl.to({}, {duration:T.duration},0);
window.addEventListener('hf-seek',e=>render(e.detail.time));
window.__timelines=window.__timelines||{};window.__timelines.scene2=tl;render(0);
</script></body></html>
