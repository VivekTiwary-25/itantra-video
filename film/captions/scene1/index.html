<script>
const rows=[{"scene":"scene1","start":0.49,"end":1.62,"text":"Hello, dear viewers.","position":"bottom"},{"scene":"scene1","start":1.85,"end":3.36,"text":"We are from team chmod 777","position":"bottom"},{"scene":"scene1","start":3.36,"end":5.43,"text":"from the National Institute\nof Engineering.","position":"bottom"},{"scene":"scene1","start":5.93,"end":6.44,"text":"I am Vachana.","position":"bottom"},{"scene":"scene1","start":7.07,"end":8.82,"text":"We are discussing on\nthe problem statement","position":"bottom"},{"scene":"scene1","start":8.82,"end":10.48,"text":"iTantra from ISRO.","position":"bottom"},{"scene":"scene1","start":10.99,"end":12.8,"text":"So, it's Indian multilingual TTS","position":"bottom"},{"scene":"scene1","start":13.26,"end":14.51,"text":"and STT aided neural transceiver","position":"bottom"},{"scene":"scene1","start":14.51,"end":17.25,"text":"radio access for low bit rate\ncommunication.","position":"bottom"},{"scene":"scene1","start":18.02,"end":19.64,"text":"What does that actually mean?","position":"bottom"},{"scene":"scene1","start":19.94,"end":21.14,"text":"Our system, iTantra,","position":"bottom"},{"scene":"scene1","start":21.38,"end":23.25,"text":"lets two Android devices communicate","position":"bottom"},{"scene":"scene1","start":23.25,"end":24.78,"text":"even when there is no SIM,","position":"bottom"},{"scene":"scene1","start":24.92,"end":27.2,"text":"no internet, no router,\nconnections, nothing.","position":"bottom"},{"scene":"scene1","start":27.72,"end":29.69,"text":"Our on-device speech-to-text model","position":"bottom"},{"scene":"scene1","start":29.69,"end":31.43,"text":"takes the speech and converts","position":"bottom"},{"scene":"scene1","start":31.43,"end":33.05,"text":"the speech into compact text.","position":"bottom"},{"scene":"scene1","start":33.5,"end":35.87,"text":"The Bluetooth-based transport\nand relay layer","position":"bottom"},{"scene":"scene1","start":35.87,"end":38.85,"text":"will send this text\ninto another device.","position":"bottom"},{"scene":"scene1","start":39.42,"end":42.3,"text":"The text-to-speech model will again","position":"bottom"},{"scene":"scene1","start":42.3,"end":44.75,"text":"convert text into speech,","position":"bottom"},{"scene":"scene1","start":44.8,"end":46.39,"text":"which is in the message's language.","position":"bottom"},{"scene":"scene1","start":46.39,"end":47.4,"text":"So, in short,","position":"bottom"},{"scene":"scene1","start":47.84,"end":50.13,"text":"the speech becomes text\nand text is sent","position":"bottom"},{"scene":"scene1","start":50.56,"end":53.08,"text":"locally, and the text\nagain becomes speech.","position":"bottom"}];

function render(t){

  caption.style.visibility='visible';
  const alpha=Math.min(1,(t-row.start)/.12,(row.end-t)/.12);
