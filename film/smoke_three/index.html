<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<script src="./three.min.js"></script>
<script src="./gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #080d15; }
  #root, canvas { display: block; width: 960px; height: 540px; }
</style>
</head>
<body>
<main id="root" data-composition-id="smoke_three" data-start="0" data-duration="2" data-width="960" data-height="540" data-fps="30"></main>
<script>
  const W = 960, H = 540;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080d15);
  const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
  camera.position.set(0, 0.2, 7.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('root').appendChild(renderer.domElement);

  const shape = new THREE.Shape();
  const x = -1.45, y = -0.88, w = 2.9, h = 1.76, r = 0.32;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.4, bevelEnabled: true, bevelThickness: 0.12,
    bevelSize: 0.12, bevelSegments: 5, curveSegments: 12
  });
  geometry.translate(0, 0, -0.2);
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xa6e8ff, metalness: 0, roughness: 0.2,
    transmission: 0.7, thickness: 0.6,
    emissive: 0x17405d, emissiveIntensity: 0.35,
    transparent: true, opacity: 0.6, side: THREE.DoubleSide
  });
  const box = new THREE.Mesh(geometry, material);
  box.rotation.x = -0.22;
  scene.add(box);

  scene.add(new THREE.AmbientLight(0x7693af, 0.55));
  const rim = new THREE.DirectionalLight(0xd5f4ff, 3.2);
  rim.position.set(-2.5, 3.5, 3.0);
  scene.add(rim);

  function draw(t) {
    box.rotation.y = Math.PI * 0.5 * Math.max(0, Math.min(2, t)) / 2;
    renderer.render(scene, camera);
  }
  const tl = gsap.timeline({ paused: true, onUpdate: () => draw(tl.time()) });
  tl.to({}, { duration: 2 }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.smoke_three = tl;
  window.addEventListener('hf-seek', e => draw(e.detail.time));
  draw(0);
</script>
</body>
</html>
